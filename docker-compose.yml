services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: margamitra
      POSTGRES_PASSWORD: margamitra
      POSTGRES_DB: margamitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margamitra -d margamitra"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
